# Keeps the Render free instance awake.
# Render stops free services after 15 minutes without traffic; this pings /health every 10 minutes.
# GitHub may delay scheduled runs, so pair it with an external monitor (UptimeRobot / cron-job.org).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: https://kiro-claude-bypass.dharmikgohil.in/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$HEALTH_URL"
